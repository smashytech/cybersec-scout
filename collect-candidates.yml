name: Collect scout candidates

# Gathers GitHub data for the Cybersec Scout digest and commits it to
# _scout/candidates.json. The scheduled Claude task reads that file, since its
# own sandbox can only reach this repository on GitHub.
# Folders starting with "_" are ignored by Jekyll, so this never shows on the site.

on:
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC, before the 06:46 Stockholm digest run
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-candidates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Collect candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _scout
          cat > /tmp/collect.py <<'PY'
          import base64, datetime as dt, json, os, re, sys, time
          import urllib.request, urllib.error, urllib.parse

          TOKEN = os.environ["GH_TOKEN"]
          API = "https://api.github.com"
          now = dt.datetime.now(dt.timezone.utc)
          since14 = (now - dt.timedelta(days=14)).date().isoformat()
          since7 = (now - dt.timedelta(days=7)).isoformat()
          errors = []

          TOPICS = ["security", "cybersecurity", "infosec", "pentest", "red-team",
                    "blue-team", "osint", "threat-intelligence", "malware-analysis",
                    "reverse-engineering", "forensics", "dfir", "vulnerability", "cve",
                    "exploit", "fuzzing", "siem", "detection-engineering",
                    "cloud-security", "appsec", "supply-chain-security",
                    "llm-security", "ai-security", "prompt-injection", "ai-red-teaming"]
          # Keyword searches (name/description) catch repos without topics set.
          KEYWORDS = ["security", "pentest", "exploit", "CVE", "malware", "OSINT",
                      "red team", "prompt injection", "LLM security", "fuzzer",
                      "detection rules", "vulnerability scanner"]
          TRENDING = ["", "python", "go", "rust", "c", "powershell"]
          BIN_EXT = (".exe", ".dll", ".so", ".dylib", ".bin", ".msi", ".scr",
                     ".zip", ".7z", ".rar", ".gz", ".jar", ".apk", ".elf", ".sys")

          def req(url, raw=False, accept="application/vnd.github+json"):
              for attempt in range(4):
                  r = urllib.request.Request(url, headers={
                      "Authorization": f"Bearer {TOKEN}", "Accept": accept,
                      "User-Agent": "cybersec-scout", "X-GitHub-Api-Version": "2022-11-28"})
                  try:
                      with urllib.request.urlopen(r, timeout=30) as resp:
                          body = resp.read()
                          return (body.decode("utf-8", "replace") if raw else json.loads(body)), resp.headers
                  except urllib.error.HTTPError as e:
                      if e.code in (403, 429) and attempt < 3:
                          time.sleep(61); continue
                      if e.code in (404, 409, 451):
                          return None, {}
                      raise
                  except urllib.error.URLError:
                      if attempt < 3:
                          time.sleep(5); continue
                      raise

          def search(q):
              url = f"{API}/search/repositories?" + urllib.parse.urlencode(
                  {"q": q, "sort": "stars", "order": "desc", "per_page": 50})
              try:
                  data, _ = req(url)
                  time.sleep(2.2)  # stay under 30 search requests/minute
                  return (data or {}).get("items", [])
              except Exception as e:
                  errors.append(f"search {q!r}: {e}")
                  return []

          cands = {}
          def add(item, source):
              if item.get("fork") or item.get("archived"):
                  return
              c = cands.setdefault(item["full_name"], {"full_name": item["full_name"], "sources": []})
              c["item"] = item
              if source not in c["sources"]:
                  c["sources"].append(source)

          for t in TOPICS:
              for it in search(f"topic:{t} created:>={since14} fork:false"):
                  add(it, f"topic:{t}")
          for k in KEYWORDS:
              q = f'"{k}" in:name,description created:>={since14} fork:false stars:>=10'
              for it in search(q):
                  add(it, f"keyword:{k}")

          # Trending pages (no API exists; parse the HTML for repo names).
          trending = {}
          for lang in TRENDING:
              for since in ("daily", "weekly"):
                  url = f"https://github.com/trending/{lang}?since={since}" if lang else f"https://github.com/trending?since={since}"
                  try:
                      r = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 cybersec-scout"})
                      html = urllib.request.urlopen(r, timeout=30).read().decode("utf-8", "replace")
                      for article in html.split('<article class="Box-row')[1:]:
                          m = re.search(r'<h2[^>]*>\s*<a[^>]*href="/([^/"]+/[^/"]+)"', article)
                          if not m:
                              continue
                          name = m.group(1)
                          g = re.search(r'([\d,]+)\s+stars? (today|this week)', article)
                          key = f"trending:{lang or 'all'}:{since}"
                          trending.setdefault(name, {})[key] = int(g.group(1).replace(",", "")) if g else None
                  except Exception as e:
                      errors.append(f"trending {lang or 'all'} {since}: {e}")
                  time.sleep(1)

          for name, hits in trending.items():
              c = cands.setdefault(name, {"full_name": name, "sources": []})
              c["trending"] = hits
              for k in hits:
                  if k not in c["sources"]:
                      c["sources"].append(k)

          owner_cache = {}
          def owner_info(login):
              if login not in owner_cache:
                  try:
                      u, _ = req(f"{API}/users/{login}")
                      owner_cache[login] = u and {
                          "login": login, "type": u.get("type"), "created_at": u.get("created_at"),
                          "public_repos": u.get("public_repos"), "followers": u.get("followers")}
                  except Exception as e:
                      owner_cache[login] = {"login": login, "error": str(e)}
              return owner_cache[login]

          def count_via_link(url):
              data, headers = req(url)
              if data is None:
                  return 0
              link = headers.get("Link", "") if headers else ""
              m = re.search(r'[?&]page=(\d+)>; rel="last"', link)
              return int(m.group(1)) if m else len(data)

          def enrich(name, full=True, repo=None):
              if repo is None:
                  repo, _ = req(f"{API}/repos/{name}")
              if not repo:
                  return None
              created = dt.datetime.fromisoformat(repo["created_at"].replace("Z", "+00:00"))
              age = max((now - created).total_seconds() / 86400, 1.0)
              out = {
                  "full_name": repo["full_name"], "html_url": repo["html_url"],
                  "description": repo.get("description"), "language": repo.get("language"),
                  "topics": repo.get("topics", []), "stars": repo["stargazers_count"],
                  "forks": repo["forks_count"], "open_issues": repo["open_issues_count"],
                  "created_at": repo["created_at"], "pushed_at": repo.get("pushed_at"),
                  "age_days": round(age, 1), "stars_per_day": round(repo["stargazers_count"] / age, 1),
                  "fork": repo.get("fork"), "archived": repo.get("archived"),
                  "license": (repo.get("license") or {}).get("spdx_id"),
                  "owner": {"login": repo["owner"]["login"]},
              }
              if not full:
                  return out
              out["owner"] = owner_info(repo["owner"]["login"])
              try:
                  out["commits_last_7d"] = count_via_link(
                      f"{API}/repos/{name}/commits?since={since7}&per_page=1")
              except Exception as e:
                  out["commits_last_7d"] = None; errors.append(f"commits {name}: {e}")
              try:
                  out["contributors"] = count_via_link(
                      f"{API}/repos/{name}/contributors?per_page=1&anon=1")
              except Exception as e:
                  out["contributors"] = None; errors.append(f"contributors {name}: {e}")
              try:
                  tree, _ = req(f"{API}/repos/{name}/git/trees/{repo['default_branch']}?recursive=1")
                  files = [(t["path"], t.get("size", 0)) for t in (tree or {}).get("tree", []) if t["type"] == "blob"]
                  out["file_count"] = len(files)
                  out["files"] = [p for p, _ in files[:150]]
                  out["binary_files"] = [p for p, _ in files if p.lower().endswith(BIN_EXT)][:30]
                  out["large_files"] = [f"{p} ({s} B)" for p, s in files if s > 1_000_000][:30]
              except Exception as e:
                  errors.append(f"tree {name}: {e}")
              try:
                  rd, _ = req(f"{API}/repos/{name}/readme")
                  if rd and rd.get("content"):
                      text = base64.b64decode(rd["content"]).decode("utf-8", "replace")
                      out["readme_excerpt"] = text[:4000]
                      out["readme_has_long_base64"] = bool(re.search(r"[A-Za-z0-9+/=]{400,}", text))
                      out["readme_download_links"] = sorted(set(re.findall(
                          r"https?://[^\s)\"'>]+\.(?:exe|zip|7z|rar|msi|bin|ps1|sh)\b", text)))[:20]
              except Exception as e:
                  errors.append(f"readme {name}: {e}")
              return out

          # Light pass for all candidates, then full detail for the 60 fastest.
          # (GITHUB_TOKEN allows ~1000 core API calls/hour, so keep this bounded.)
          light = []
          for name in list(cands):
              try:
                  info = enrich(name, full=False, repo=cands[name].get("item"))
              except Exception as e:
                  errors.append(f"repo {name}: {e}"); continue
              if info:
                  info["sources"] = cands[name]["sources"]
                  if "trending" in cands[name]:
                      info["trending"] = cands[name]["trending"]
                  light.append(info)
          light.sort(key=lambda r: r["stars_per_day"], reverse=True)
          detailed = []
          for i, r in enumerate(light):
              if i < 60:
                  try:
                      full = enrich(r["full_name"], full=True) or r
                      full["sources"] = r["sources"]
                      if "trending" in r:
                          full["trending"] = r["trending"]
                      detailed.append(full)
                  except Exception as e:
                      errors.append(f"detail {r['full_name']}: {e}"); detailed.append(r)
              else:
                  detailed.append(r)

          # Current stars for repos reported before, for the "still climbing" check.
          seen_now = {}
          try:
              seen = json.load(open("seen-repos.json"))
              cutoff = (now - dt.timedelta(days=120)).date().isoformat()
              recent = [e for e in seen if str(e.get("first_seen", "")) >= cutoff][-250:]
              for e in recent:
                  name = e["repo"].replace("https://github.com/", "").strip("/")
                  try:
                      repo, _ = req(f"{API}/repos/{name}")
                      if repo:
                          seen_now[e["repo"]] = repo["stargazers_count"]
                  except Exception as ex:
                      errors.append(f"seen {name}: {ex}")
          except Exception as ex:
              errors.append(f"seen-repos.json: {ex}")

          json.dump({
              "generated_at": now.isoformat(), "window_start": since14,
              "candidate_count": len(detailed), "errors": errors,
              "seen_repos_current_stars": seen_now, "candidates": detailed,
          }, open("_scout/candidates.json", "w"), indent=1, ensure_ascii=False)
          print(f"{len(detailed)} candidates, {len(errors)} errors")
          PY
          python3 /tmp/collect.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add _scout/candidates.json
          git diff --cached --quiet && exit 0
          git commit -m "Update scout candidates $(date -u +%F)"
          git pull --rebase origin main && git push origin HEAD:main
